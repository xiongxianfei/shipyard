name: CI — C++

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - '.github/workflows/ci-cpp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cpp/**'
      - '.github/workflows/ci-cpp.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test C++ image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR / schedule — load locally for smoke test)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./cpp
          push: false
          load: true
          tags: dev-cpp:ci
          cache-from: type=gha,scope=cpp
          cache-to:   type=gha,scope=cpp,mode=max

      - name: Smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm dev-cpp:ci gcc --version
          docker run --rm dev-cpp:ci g++ --version
          docker run --rm dev-cpp:ci clang --version
          docker run --rm dev-cpp:ci cmake --version
          docker run --rm dev-cpp:ci conan --version
          docker run --rm dev-cpp:ci vcpkg version
          docker run --rm dev-cpp:ci cppcheck --version
          docker run --rm dev-cpp:ci valgrind --version

      - name: Build and push to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./cpp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-cpp:latest
            ghcr.io/${{ github.repository_owner }}/dev-cpp:sha-${{ github.sha }}
          cache-from: type=gha,scope=cpp
          cache-to:   type=gha,scope=cpp,mode=max
