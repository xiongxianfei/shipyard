name: CI — Binary Analysis

on:
  push:
    branches: [main]
    paths:
      - 'binary-analysis/**'
      - '.github/workflows/ci-binary-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'binary-analysis/**'
      - '.github/workflows/ci-binary-analysis.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test binary analysis image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR / schedule — load locally for smoke test)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./binary-analysis
          push: false
          load: true
          tags: dev-binary-analysis:ci
          cache-from: type=gha,scope=binary-analysis
          cache-to:   type=gha,scope=binary-analysis,mode=max

      - name: Smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm dev-binary-analysis:ci gdb --version
          docker run --rm dev-binary-analysis:ci r2 -v
          docker run --rm dev-binary-analysis:ci objdump --version
          docker run --rm dev-binary-analysis:ci readelf --version
          docker run --rm dev-binary-analysis:ci nasm -v
          docker run --rm dev-binary-analysis:ci python3 -c "import capstone; print('capstone', capstone.__version__)"
          docker run --rm dev-binary-analysis:ci python3 -c "import unicorn; print('unicorn ok')"
          docker run --rm dev-binary-analysis:ci python3 -c "import lief; print('lief', lief.__version__)"
          docker run --rm dev-binary-analysis:ci python3 -c "import angr; print('angr', angr.__version__)"
          docker run --rm dev-binary-analysis:ci python3 -c "import pwnlib; print('pwntools', pwnlib.__version__)"

      - name: Build and push to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./binary-analysis
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-binary-analysis:latest
            ghcr.io/${{ github.repository_owner }}/dev-binary-analysis:sha-${{ github.sha }}
          cache-from: type=gha,scope=binary-analysis
          cache-to:   type=gha,scope=binary-analysis,mode=max
