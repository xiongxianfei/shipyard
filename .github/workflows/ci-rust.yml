name: CI — Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/ci-rust.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test Rust image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR / schedule — load locally for smoke test)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./rust
          push: false
          load: true
          tags: dev-rust:ci
          cache-from: type=gha,scope=rust
          cache-to:   type=gha,scope=rust,mode=max

      - name: Smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm dev-rust:ci rustc --version
          docker run --rm dev-rust:ci cargo --version
          docker run --rm dev-rust:ci cargo clippy --version
          docker run --rm dev-rust:ci cargo fmt --version
          docker run --rm dev-rust:ci cargo watch --version
          docker run --rm dev-rust:ci cargo audit --version
          docker run --rm dev-rust:ci cargo nextest --version

      - name: Build and push to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./rust
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-rust:latest
            ghcr.io/${{ github.repository_owner }}/dev-rust:sha-${{ github.sha }}
          cache-from: type=gha,scope=rust
          cache-to:   type=gha,scope=rust,mode=max
