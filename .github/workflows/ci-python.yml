name: CI — Python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test Python image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR / schedule — load locally for smoke test)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./python
          push: false
          load: true
          tags: dev-python:ci
          cache-from: type=gha,scope=python
          cache-to:   type=gha,scope=python,mode=max

      - name: Smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm dev-python:ci python --version
          docker run --rm dev-python:ci poetry --version
          docker run --rm dev-python:ci uv --version
          docker run --rm dev-python:ci ruff --version
          docker run --rm dev-python:ci mypy --version
          docker run --rm dev-python:ci pytest --version

      - name: Build and push to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./python
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-python:latest
            ghcr.io/${{ github.repository_owner }}/dev-python:sha-${{ github.sha }}
          cache-from: type=gha,scope=python
          cache-to:   type=gha,scope=python,mode=max
