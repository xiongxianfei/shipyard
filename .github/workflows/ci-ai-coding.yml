name: CI — AI Coding

on:
  push:
    branches: [main]
    paths:
      - 'ai-coding/**'
      - '.github/workflows/ci-ai-coding.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-coding/**'
      - '.github/workflows/ci-ai-coding.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test AI coding image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR / schedule — load locally for smoke test)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ai-coding
          push: false
          load: true
          tags: dev-ai:ci
          cache-from: type=gha,scope=ai-coding
          cache-to:   type=gha,scope=ai-coding,mode=max

      - name: Smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm dev-ai:ci python -c "import torch; print(torch.__version__)"
          docker run --rm dev-ai:ci python -c "import transformers; print(transformers.__version__)"
          docker run --rm dev-ai:ci python -c "import numpy, pandas, sklearn; print('science stack ok')"
          docker run --rm dev-ai:ci jupyter --version

      - name: Build and push to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ai-coding
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-ai:latest
            ghcr.io/${{ github.repository_owner }}/dev-ai:sha-${{ github.sha }}
          cache-from: type=gha,scope=ai-coding
          cache-to:   type=gha,scope=ai-coding,mode=max
