name: CI — Go

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/ci-go.yml'
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke-test Go image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./go
          push: false
          load: true
          tags: dev-go:ci
          cache-from: type=gha,scope=go
          cache-to:   type=gha,scope=go,mode=max

      - name: Smoke test
        run: |
          docker run --rm dev-go:ci go version
          docker run --rm dev-go:ci air -v
          docker run --rm dev-go:ci dlv version
          docker run --rm dev-go:ci golangci-lint --version
          docker run --rm dev-go:ci staticcheck -version
          docker run --rm dev-go:ci gopls version
