services:

  ctf:
    build:
      context: ./ctf
      dockerfile: Dockerfile
    image: dev-ctf:latest
    container_name: dev-ctf
    hostname: ctf-box
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      core: -1
    volumes:
      - ./ctf/workspace:/workspace
    stdin_open: true
    tty: true
    # network_mode: host  # Linux only — enables host networking for exploit dev
    #                       On Windows/macOS Docker Desktop this is silently ignored

  ai-coding:
    build:
      context: ./ai-coding
      dockerfile: Dockerfile
    image: dev-ai:latest
    container_name: dev-ai
    volumes:
      - ./ai-coding/workspace:/workspace
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    # Uncomment for GPU support (requires nvidia-container-toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  cpp:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    image: dev-cpp:latest
    container_name: dev-cpp
    volumes:
      - ./cpp/workspace:/workspace
    stdin_open: true
    tty: true

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    image: dev-python:latest
    container_name: dev-python
    volumes:
      - ./python/workspace:/workspace
    stdin_open: true
    tty: true

  go:
    build:
      context: ./go
      dockerfile: Dockerfile
    image: dev-go:latest
    container_name: dev-go
    volumes:
      - ./go/workspace:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8080:8080"
      - "2345:2345"
    stdin_open: true
    tty: true

  binary-analysis:
    build:
      context: ./binary-analysis
      dockerfile: Dockerfile
    image: dev-binary-analysis:latest
    container_name: dev-binary-analysis
    hostname: binary-analysis-box
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      core: -1
    volumes:
      - ./binary-analysis/workspace:/workspace
    stdin_open: true
    tty: true

  java:
    build:
      context: ./java
      dockerfile: Dockerfile
    image: dev-java:latest
    container_name: dev-java
    volumes:
      - ./java/workspace:/workspace
      - maven-repo:/root/.m2
      - gradle-cache:/root/.gradle
    ports:
      - "8090:8080"
    stdin_open: true
    tty: true

  rust:
    build:
      context: ./rust
      dockerfile: Dockerfile
    image: dev-rust:latest
    container_name: dev-rust
    volumes:
      - ./rust/workspace:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    stdin_open: true
    tty: true

volumes:
  go-mod-cache:
  go-build-cache:
  maven-repo:
  gradle-cache:
  cargo-registry:
  cargo-git:
